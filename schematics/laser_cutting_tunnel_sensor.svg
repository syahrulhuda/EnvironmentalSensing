<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="240mm" viewBox="0 0 320 240">
  <title>Desain 2D Akrilik 3mm - Tunnel Sensor Gas (Pelat 12 cm, MQ 4-Hole Mount, Fan 3010)</title>
  <style>
    .cut { fill: none; stroke: #ff0000; stroke-width: 0.25; }
    .slot { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .hole { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .text-label { fill: #222222; font-family: Arial, sans-serif; font-size: 3.2px; font-weight: bold; }
    .dim-label { fill: #555555; font-family: Arial, sans-serif; font-size: 1.8px; }
  </style>

  <!-- INFO HEADER -->
  <text x="10" y="8" font-family="Arial, sans-serif" font-size="3.8px" font-weight="bold" fill="#222">DESAIN 1: TUNNEL SENSOR GAS (120 x 50 MM) - MOUNTING 4 BAUT MQ-2 &amp; MQ-7 + FAN 3010 (3x3 CM)</text>
  <text x="10" y="13" font-family="Arial, sans-serif" font-size="2.0px" fill="#555">Pelat: 120x50 mm | Fan 3010: Pitch 24x24 mm, Bore 24 mm | MQ Mount: Pitch 15x26.5 mm M3 | Spacer PCB: 25 mm</text>

  <!-- 1. PELAT ATAS (TOP PLATE) - 120 x 50 mm -->
  <g transform="translate(10, 20)">
    <text x="0" y="-3" font-family="Arial, sans-serif" font-size="2.8px" font-weight="bold" fill="#222">1. Pelat Atas Tunnel (120 x 50 mm - 4 Baut MQ-7 &amp; MQ-2 Bebas Tabrakan + Fan Cable Slot)</text>
    <rect x="0" y="0" width="120" height="50" rx="3.5" class="cut" />
    
    <!-- 4 Corner Tie-Down Holes Tunnel (3.5, 4.5 &amp; 116.5, 45.5) -->
    <circle cx="3.5" cy="4.5" r="1.6" class="hole" />
    <circle cx="116.5" cy="4.5" r="1.6" class="hole" />
    <circle cx="3.5" cy="45.5" r="1.6" class="hole" />
    <circle cx="116.5" cy="45.5" r="1.6" class="hole" />
    
    <!-- Slot Dinding Samping Tunnel (X: 20-40 &amp; 80-100, Y: 1.9 &amp; 45.0, panjang 20 mm, tebal 3.1 mm) -->
    <rect x="20.0" y="1.9" width="20.0" height="3.1" class="slot" />
    <rect x="80.0" y="1.9" width="20.0" height="3.1" class="slot" />
    <rect x="20.0" y="45.0" width="20.0" height="3.1" class="slot" />
    <rect x="80.0" y="45.0" width="20.0" height="3.1" class="slot" />

    <!-- Slot Dinding Samping Case PCB (Tengah: X: 50-70, panjang 20 mm, tebal 3.1 mm) -->
    <rect x="50.0" y="1.9" width="20.0" height="3.1" stroke="#0000ff" stroke-width="0.2" fill="none" />
    <rect x="50.0" y="45.0" width="20.0" height="3.1" stroke="#0000ff" stroke-width="0.2" fill="none" />
    <text x="51.0" y="1.2" font-family="Arial, sans-serif" font-size="1.4px" fill="#0000aa">SLOT DINDING CASE (20 MM)</text>
    
    <!-- Slot Inlet Depan &amp; Outlet Belakang Tunnel (Panjang 20 mm: Y: 15-35) -->
    <rect x="6.9" y="15.0" width="3.1" height="20.0" class="slot" />
    <rect x="110.0" y="15.0" width="3.1" height="20.0" class="slot" />

    <!-- Slot Dinding Depan &amp; Belakang Case PCB (X: 12.0-15.1 &amp; 104.9-108.0, Y: 15-35) -->
    <rect x="12.0" y="15.0" width="3.1" height="20.0" stroke="#0000ff" stroke-width="0.2" fill="none" />
    <rect x="104.9" y="15.0" width="3.1" height="20.0" stroke="#0000ff" stroke-width="0.2" fill="none" />

    <!-- 4 Lubang Spacer Internal Case PCB (M3) - Bebas Halangan Dinding & Bebas PCB -->
    <circle cx="20.0" cy="9.5" r="1.6" stroke="#00aa00" stroke-width="0.25" fill="none" />
    <circle cx="100.5" cy="9.5" r="1.6" stroke="#00aa00" stroke-width="0.25" fill="none" />
    <circle cx="20.0" cy="40.5" r="1.6" stroke="#00aa00" stroke-width="0.25" fill="none" />
    <circle cx="100.5" cy="40.5" r="1.6" stroke="#00aa00" stroke-width="0.25" fill="none" />
    <text x="14.0" y="8.0" font-family="Arial, sans-serif" font-size="1.4px" fill="#008800">SPACER CASE</text>
    <text x="94.0" y="8.0" font-family="Arial, sans-serif" font-size="1.4px" fill="#008800">SPACER CASE</text>

    <!-- 4 Lubang Baut PCB (M3) - Pitch 64.4 x 34.4 mm (Spacer 25 mm) -->
    <circle cx="27.8" cy="7.8" r="1.6" stroke="#aa00aa" stroke-width="0.25" fill="none" />
    <circle cx="92.2" cy="7.8" r="1.6" stroke="#aa00aa" stroke-width="0.25" fill="none" />
    <circle cx="27.8" cy="42.2" r="1.6" stroke="#aa00aa" stroke-width="0.25" fill="none" />
    <circle cx="92.2" cy="42.2" r="1.6" stroke="#aa00aa" stroke-width="0.25" fill="none" />

    <!-- SENSOR MQ-7: Center (40.0, 25.0), Canister Dia 18.4 mm -->
    <circle cx="40.0" cy="25.0" r="9.2" class="cut" />
    <!-- 4 Baut Pengunci MQ-7 (Pitch 15.0 x 26.5 mm) - Dinding solid 4.4 mm! -->
    <circle cx="32.5" cy="11.75" r="1.6" class="hole" />
    <circle cx="47.5" cy="11.75" r="1.6" class="hole" />
    <circle cx="32.5" cy="38.25" r="1.6" class="hole" />
    <circle cx="47.5" cy="38.25" r="1.6" class="hole" />
    <text x="34.0" y="25.5" font-family="Arial, sans-serif" font-size="2.0px" fill="#d00">MQ-7 (CO)</text>

    <!-- SENSOR MQ-2: Center (66.0, 25.0), Canister Dia 20.5 mm -->
    <circle cx="66.0" cy="25.0" r="10.25" class="cut" />
    <!-- 4 Baut Pengunci MQ-2 (Pitch 15.0 x 26.5 mm) - Dinding solid 3.4 mm! -->
    <circle cx="58.5" cy="11.75" r="1.6" class="hole" />
    <circle cx="73.5" cy="11.75" r="1.6" class="hole" />
    <circle cx="58.5" cy="38.25" r="1.6" class="hole" />
    <circle cx="73.5" cy="38.25" r="1.6" class="hole" />
    <text x="59.5" y="25.5" font-family="Arial, sans-serif" font-size="2.0px" fill="#d00">MQ-2 (LPG)</text>

    <!-- INTERNAL FAN CABLE PASS-THROUGH HOLE -->
    <rect x="94.0" y="31.75" width="8.0" height="4.5" rx="1.2" stroke="#ff6600" stroke-width="0.25" fill="none" />
    <text x="93.0" y="30.5" font-family="Arial, sans-serif" font-size="1.5px" fill="#ff6600">KABEL FAN</text>
  </g>

  <!-- 2. PELAT BAWAH (BOTTOM PLATE) - 120 x 50 mm -->
  <g transform="translate(10, 80)">
    <text x="0" y="-3" font-family="Arial, sans-serif" font-size="2.8px" font-weight="bold" fill="#222">2. Pelat Bawah Tunnel (120 x 50 mm - Solid Base)</text>
    <rect x="0" y="0" width="120" height="50" rx="3.5" class="cut" />
    <circle cx="3.5" cy="4.5" r="1.6" class="hole" />
    <circle cx="116.5" cy="4.5" r="1.6" class="hole" />
    <circle cx="3.5" cy="45.5" r="1.6" class="hole" />
    <circle cx="116.5" cy="45.5" r="1.6" class="hole" />
    <rect x="20.0" y="1.9" width="20.0" height="3.1" class="slot" />
    <rect x="80.0" y="1.9" width="20.0" height="3.1" class="slot" />
    <rect x="20.0" y="45.0" width="20.0" height="3.1" class="slot" />
    <rect x="80.0" y="45.0" width="20.0" height="3.1" class="slot" />
    <rect x="6.9" y="15.0" width="3.1" height="20.0" class="slot" />
    <rect x="110.0" y="15.0" width="3.1" height="20.0" class="slot" />
  </g>

  <!-- 3. DINDING SAMPLING TUNNEL (2 PCS) - 100 x 40 mm -->
  <g transform="translate(140, 20)">
    <text x="0" y="-3" font-family="Arial, sans-serif" font-size="2.8px" font-weight="bold" fill="#222">3. Dinding Samping Tunnel (100 x 40 mm bodi, 2 pcs)</text>
    <path d="M 0,3 L 10,3 L 10,0 L 30,0 L 30,3 L 70,3 L 70,0 L 90,0 L 90,3 L 100,3 L 100,43 L 90,43 L 90,46 L 70,46 L 70,43 L 30,43 L 30,46 L 10,46 L 10,43 L 0,43 Z" class="cut" />
    <text x="20" y="24" font-family="Arial, sans-serif" font-size="2.2px" fill="#555">Dinding Samping Tunnel (Bodi 100 x 40 mm)</text>
  </g>

  <!-- 4. INLET & OUTLET FAN 3010 (3x3 CM) -->
  <g transform="translate(140, 80)">
    <text x="0" y="-3" font-family="Arial, sans-serif" font-size="2.8px" font-weight="bold" fill="#222">4. Inlet Depan &amp; Outlet Kipas 3010 (30 x 30 mm, Pitch 24 x 24 mm)</text>
    <!-- Inlet Depan (Kisi-kisi Honeycomb 31 Lubang Dia 2.3 mm, Pitch 3.7 mm) -->
    <path d="M 0,3 L 10,3 L 10,0 L 30,0 L 30,3 L 40,3 L 40,43 L 30,43 L 30,46 L 10,46 L 10,43 L 0,43 Z" class="cut" />
    <circle cx="20" cy="23" r="12" stroke="#888888" stroke-width="0.15" stroke-dasharray="1,1" fill="none" />
    <circle cx="18.15" cy="13.39" r="1.15" class="hole" />
    <circle cx="21.85" cy="13.39" r="1.15" class="hole" />
    <circle cx="12.60" cy="16.59" r="1.15" class="hole" />
    <circle cx="16.30" cy="16.59" r="1.15" class="hole" />
    <circle cx="20.00" cy="16.59" r="1.15" class="hole" />
    <circle cx="23.70" cy="16.59" r="1.15" class="hole" />
    <circle cx="27.40" cy="16.59" r="1.15" class="hole" />
    <circle cx="10.75" cy="19.80" r="1.15" class="hole" />
    <circle cx="14.45" cy="19.80" r="1.15" class="hole" />
    <circle cx="18.15" cy="19.80" r="1.15" class="hole" />
    <circle cx="21.85" cy="19.80" r="1.15" class="hole" />
    <circle cx="25.55" cy="19.80" r="1.15" class="hole" />
    <circle cx="29.25" cy="19.80" r="1.15" class="hole" />
    <circle cx="12.60" cy="23.00" r="1.15" class="hole" />
    <circle cx="16.30" cy="23.00" r="1.15" class="hole" />
    <circle cx="20.00" cy="23.00" r="1.15" class="hole" />
    <circle cx="23.70" cy="23.00" r="1.15" class="hole" />
    <circle cx="27.40" cy="23.00" r="1.15" class="hole" />
    <circle cx="10.75" cy="26.20" r="1.15" class="hole" />
    <circle cx="14.45" cy="26.20" r="1.15" class="hole" />
    <circle cx="18.15" cy="26.20" r="1.15" class="hole" />
    <circle cx="21.85" cy="26.20" r="1.15" class="hole" />
    <circle cx="25.55" cy="26.20" r="1.15" class="hole" />
    <circle cx="29.25" cy="26.20" r="1.15" class="hole" />
    <circle cx="12.60" cy="29.41" r="1.15" class="hole" />
    <circle cx="16.30" cy="29.41" r="1.15" class="hole" />
    <circle cx="20.00" cy="29.41" r="1.15" class="hole" />
    <circle cx="23.70" cy="29.41" r="1.15" class="hole" />
    <circle cx="27.40" cy="29.41" r="1.15" class="hole" />
    <circle cx="18.15" cy="32.61" r="1.15" class="hole" />
    <circle cx="21.85" cy="32.61" r="1.15" class="hole" />
    <text x="8" y="39" font-family="Arial, sans-serif" font-size="1.8px" fill="#555">INLET KISI (31 LUBANG)</text>
    <!-- Outlet Fan 3010 -->
    <g transform="translate(50, 0)">
      <path d="M 0,3 L 10,3 L 10,0 L 30,0 L 30,3 L 40,3 L 40,43 L 30,43 L 30,46 L 10,46 L 10,43 L 0,43 Z" class="cut" />
      <!-- Bore 24 mm (Radius 12 mm) -->
      <circle cx="20" cy="23" r="12" class="cut" />
      <!-- 4 Screw holes M3 Pitch 24x24 mm -->
      <circle cx="8" cy="11" r="1.6" class="hole" />
      <circle cx="32" cy="11" r="1.6" class="hole" />
      <circle cx="8" cy="35" r="1.6" class="hole" />
      <circle cx="32" cy="35" r="1.6" class="hole" />
      <text x="10" y="23.5" font-family="Arial, sans-serif" font-size="1.8px" fill="#555">FAN 3010</text>
    </g>
  </g>
</svg>