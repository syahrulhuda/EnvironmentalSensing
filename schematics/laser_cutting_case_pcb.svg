<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="230mm" viewBox="0 0 320 230">
  <title>Desain 2D Akrilik 3mm - Case PCB ESS 70x40 mm (Space 1 cm Kiri &amp; Kanan)</title>
  <desc>Sesuai Permintaan Huda: Space 1 cm Kiri-Kanan, Dinding Kiri Lubang Type-C, Dinding Kanan Lubang Terminal KF301 &amp; Soket Kipas CN1</desc>
  <style>
    .cut { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .slot { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .hole { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .engrave { fill: none; stroke: #0000ff; stroke-width: 0.15; font-family: Arial, sans-serif; font-size: 2.8px; }
    .text-label { fill: #222222; font-family: Arial, sans-serif; font-size: 3.5px; font-weight: bold; }
    .dim-label { fill: #555555; font-family: Arial, sans-serif; font-size: 2.2px; }
  </style>

  <!-- HEADER INFORMASI -->
  <text x="10" y="8" class="text-label" font-size="4.8px">DESAIN 2: CASE PCB ESS 70x40 MM (CLEARANCE 1 CM KIRI-KANAN) - AKRILIK 3 MM</text>
  <text x="10" y="13" class="dim-label">Dimensi Luar Case: 96 x 66 x 45 mm | Ruang Dalam: 90 x 60 mm (Space Pas 1.0 cm Mengelilingi PCB 70x40 mm)</text>

  <!-- 1. PELAT ATAS (TOP COVER) - 96 x 66 mm -->
  <g transform="translate(10, 18)">
    <text x="0" y="-2" class="text-label">1. Pelat Atas (Dudukan DHT22, Lubang LED RGB &amp; Ventilasi) - 96 x 66 mm</text>
    <rect x="0" y="0" width="96" height="66" rx="3.5" class="cut" />
    
    <!-- 4 Lubang Tiang Spacer Sudut M3 (Dia 3.2 mm) -->
    <circle cx="5.5" cy="5.5" r="1.6" class="hole" />
    <circle cx="90.5" cy="5.5" r="1.6" class="hole" />
    <circle cx="5.5" cy="60.5" r="1.6" class="hole" />
    <circle cx="90.5" cy="60.5" r="1.6" class="hole" />
    
    <!-- Slot Pengunci Dinding Belakang & Depan (Tebal akrilik 3.1mm) -->
    <rect x="20" y="2" width="20" height="3.1" class="slot" />
    <rect x="56" y="2" width="20" height="3.1" class="slot" />
    <rect x="20" y="60.9" width="20" height="3.1" class="slot" />
    <rect x="56" y="60.9" width="20" height="3.1" class="slot" />
    
    <!-- Slot Pengunci Dinding Kiri & Kanan -->
    <rect x="2" y="15" width="3.1" height="15" class="slot" />
    <rect x="2" y="36" width="3.1" height="15" class="slot" />
    <rect x="90.9" y="15" width="3.1" height="15" class="slot" />
    <rect x="90.9" y="36" width="3.1" height="15" class="slot" />
    
    <!-- DUDUKAN SENSOR DHT22 (Selaras vertikal dengan Header H4 di X=48, Y=48) -->
    <!-- Celah Kepala Probe DHT22: 16 x 22 mm di X=40 s/d 56, Y=33 s/d 55 -->
    <rect x="40" y="33" width="16" height="22" rx="1.5" class="hole" />
    <!-- Lubang Baut Pengunci Kuping DHT22 M3 di X=48, Y=26 -->
    <circle cx="48" cy="26" r="1.6" class="hole" />
    <text x="37" y="22" class="dim-label" font-size="2.1px">DUDUKAN SENSOR DHT22</text>
    
    <!-- LUBANG INTIP INDIKATOR LED RGB D1 (Dia 6.0 mm) di X=53.6, Y=22.4 -->
    <circle cx="53.6" cy="22.4" r="3.0" class="hole" />
    <text x="50" y="16" class="dim-label" font-size="1.9px">LED RGB</text>
    
    <!-- KISI VENTILASI PASIF PELAT ATAS -->
    <rect x="18" y="22" width="14" height="2" rx="1" class="slot" />
    <rect x="18" y="27" width="14" height="2" rx="1" class="slot" />
    <rect x="18" y="32" width="14" height="2" rx="1" class="slot" />
    <rect x="18" y="37" width="14" height="2" rx="1" class="slot" />
    
    <rect x="68" y="22" width="14" height="2" rx="1" class="slot" />
    <rect x="68" y="27" width="14" height="2" rx="1" class="slot" />
    <rect x="68" y="32" width="14" height="2" rx="1" class="slot" />
    <rect x="68" y="37" width="14" height="2" rx="1" class="slot" />
  </g>

  <!-- 2. PELAT BAWAH (BOTTOM BASE) - 96 x 66 mm -->
  <g transform="translate(116, 18)">
    <text x="0" y="-2" class="text-label">2. Pelat Bawah (Dudukan PCB 70x40 mm Presisi) - 96 x 66 mm</text>
    <rect x="0" y="0" width="96" height="66" rx="3.5" class="cut" />
    
    <!-- 4 Lubang Tiang Spacer Sudut M3 -->
    <circle cx="5.5" cy="5.5" r="1.6" class="hole" />
    <circle cx="90.5" cy="5.5" r="1.6" class="hole" />
    <circle cx="5.5" cy="60.5" r="1.6" class="hole" />
    <circle cx="90.5" cy="60.5" r="1.6" class="hole" />
    
    <!-- Slot Pengunci Dinding -->
    <rect x="20" y="2" width="20" height="3.1" class="slot" />
    <rect x="56" y="2" width="20" height="3.1" class="slot" />
    <rect x="20" y="60.9" width="20" height="3.1" class="slot" />
    <rect x="56" y="60.9" width="20" height="3.1" class="slot" />
    <rect x="2" y="15" width="3.1" height="15" class="slot" />
    <rect x="2" y="36" width="3.1" height="15" class="slot" />
    <rect x="90.9" y="15" width="3.1" height="15" class="slot" />
    <rect x="90.9" y="36" width="3.1" height="15" class="slot" />
    
    <!-- GARIS BANTU GRAFIR KONTUR PCB 70 x 40 MM (Tepat di tengah: x=13 s/d 83, y=13 s/d 53 mm) -->
    <rect x="13" y="13" width="70" height="40" rx="1.5" class="engrave" stroke-dasharray="1,1" />
    <text x="31" y="33" class="dim-label" font-size="2.4px">AREA PCB 70 x 40 MM</text>
    
    <!-- 4 LUBANG BAUT PCB PRESISE EASYEDA (Pitch 64.4 x 34.4 mm):
         Hole 1 (Top-Left):     (15.8, 15.8)
         Hole 2 (Top-Right):    (80.2, 15.8)
         Hole 3 (Bottom-Left):  (15.8, 50.2)
         Hole 4 (Bottom-Right): (80.2, 50.2)
         Dibuat slot oval 3.5 x 4.5 mm dengan radius 1.75 mm untuk toleransi perakitan -->
    <rect x="14.05" y="14.05" width="3.5" height="3.5" rx="1.75" class="hole" />
    <rect x="78.45" y="14.05" width="3.5" height="3.5" rx="1.75" class="hole" />
    <rect x="14.05" y="48.45" width="3.5" height="3.5" rx="1.75" class="hole" />
    <rect x="78.45" y="48.45" width="3.5" height="3.5" rx="1.75" class="hole" />
    <text x="26" y="27" class="dim-label" font-size="2.0px">PITCH BAUT: 64.4 x 34.4 MM</text>
  </g>

  <!-- 3. PELAT DINDING KIRI (PANEL USB-C ESP32-C3) - 66 x 39 mm -->
  <g transform="translate(10, 95)">
    <text x="0" y="-2" class="text-label">3. Panel Sisi Kiri (Port USB Type-C ESP32-C3) - 66 x 39 mm</text>
    <path d="M 0,3 
             L 15,3 L 15,0 L 30,0 L 30,3 
             L 36,3 L 36,0 L 51,0 L 51,3 
             L 66,3 L 66,36 
             L 51,36 L 51,39 L 36,39 L 36,36 
             L 30,36 L 30,39 L 15,39 L 15,36 
             L 0,36 Z" class="cut" />
    <!-- PORT USB TYPE-C ESP32-C3: Tepat di Center Sumbu PCB (x=33.0 mm pada panel 66 mm) -->
    <!-- Ukuran bukaan 16 x 9 mm dengan radius 3 mm agar kepala kabel USB-C leluasa mencolok 1 cm -->
    <rect x="25" y="15" width="16" height="9" rx="3" class="slot" />
    <text x="20" y="11" class="dim-label" font-size="2.1px">USB-C ESP32-C3</text>
    
    <!-- Ventilasi Sisi Kiri -->
    <rect x="8" y="16" width="12" height="2" rx="1" class="slot" />
    <rect x="8" y="21" width="12" height="2" rx="1" class="slot" />
    <rect x="46" y="16" width="12" height="2" rx="1" class="slot" />
    <rect x="46" y="21" width="12" height="2" rx="1" class="slot" />
  </g>

  <!-- 4. PELAT DINDING KANAN (2 LUBANG: TERMINAL SCREW KF301 & SOKET KIPAS CN1) - 66 x 39 mm -->
  <g transform="translate(116, 95)">
    <text x="0" y="-2" class="text-label">4. Panel Sisi Kanan (Screw Terminal &amp; Soket Kipas CN1) - 66 x 39 mm</text>
    <path d="M 0,3 
             L 15,3 L 15,0 L 30,0 L 30,3 
             L 36,3 L 36,0 L 51,0 L 51,3 
             L 66,3 L 66,36 
             L 51,36 L 51,39 L 36,39 L 36,36 
             L 30,36 L 30,39 L 15,39 L 15,36 
             L 0,36 Z" class="cut" />
    
    <!-- LUBANG 1: SCREW TERMINAL KF301 (Input Power 5V) di Center X=25.0 mm -->
    <!-- Celah ukuran 13 x 9.5 mm untuk kabel power dan obeng baut terminal -->
    <rect x="18.5" y="14" width="13" height="9.5" rx="2" class="slot" />
    <text x="14" y="10" class="dim-label" font-size="2.0px">SCREW TERMINAL (5V)</text>
    
    <!-- LUBANG 2: SOKET KIPAS CN1 (JST-XH 2.54 Siku) di Center X=42.0 mm -->
    <!-- Celah ukuran 12 x 9 mm untuk colokan kabel kipas 4010 menuju tunnel -->
    <rect x="36" y="14.5" width="12" height="9" rx="2" class="slot" />
    <text x="36" y="10" class="dim-label" font-size="2.0px">SOKET KIPAS (CN1)</text>
    
    <!-- Ventilasi Tambahan di Dinding Kanan -->
    <rect x="8" y="27" width="22" height="2" rx="1" class="slot" />
    <rect x="36" y="27" width="22" height="2" rx="1" class="slot" />
  </g>

  <!-- 5. PELAT DINDING BELAKANG (KELUARAN KABEL SENSOR MQ-2 & MQ-7 MENUJU TUNNEL) - 96 x 39 mm -->
  <g transform="translate(10, 150)">
    <text x="0" y="-2" class="text-label">5. Panel Belakang (Keluaran Kabel ke Tunnel Sensor Gas) - 96 x 39 mm</text>
    <path d="M 0,3 
             L 20,3 L 20,0 L 40,0 L 40,3 
             L 56,3 L 56,0 L 76,0 L 76,3 
             L 96,3 L 96,36 
             L 76,36 L 76,39 L 56,39 L 56,36 
             L 40,36 L 40,39 L 20,39 L 20,36 
             L 0,36 Z" class="cut" />
    <!-- Celah Kabel Lurus Tepat di Depan Header MQ-7 & MQ-2 (X=20 s/d 48 mm) -->
    <rect x="20" y="15" width="28" height="10" rx="3" class="slot" />
    <text x="18" y="11" class="dim-label" font-size="2.0px">KABEL KE TUNNEL (MQ-2 &amp; MQ-7)</text>
    <!-- 2 Lubang Tali Zip-Tie Pengikat Kabel -->
    <circle cx="16" cy="20" r="1.5" class="hole" />
    <circle cx="51" cy="20" r="1.5" class="hole" />
    <!-- Ventilasi Sisi Kanan Panel Belakang -->
    <rect x="62" y="16" width="24" height="2" rx="1" class="slot" />
    <rect x="62" y="21" width="24" height="2" rx="1" class="slot" />
  </g>

  <!-- 6. PELAT DINDING DEPAN (PANEL DEPAN DENGAN VENTILASI) - 96 x 39 mm -->
  <g transform="translate(116, 150)">
    <text x="0" y="-2" class="text-label">6. Panel Depan (Ventilasi Sirkulasi Box) - 96 x 39 mm</text>
    <path d="M 0,3 
             L 20,3 L 20,0 L 40,0 L 40,3 
             L 56,3 L 56,0 L 76,0 L 76,3 
             L 96,3 L 96,36 
             L 76,36 L 76,39 L 56,39 L 56,36 
             L 40,36 L 40,39 L 20,39 L 20,36 
             L 0,36 Z" class="cut" />
    <!-- Kisi-kisi Ventilasi Pasif Bertingkat Elegan -->
    <rect x="20" y="14" width="56" height="2.5" rx="1.2" class="slot" />
    <rect x="25" y="19" width="46" height="2.5" rx="1.2" class="slot" />
    <rect x="30" y="24" width="36" height="2.5" rx="1.2" class="slot" />
    <text x="37" y="10" class="dim-label" font-size="2.0px">PANEL SISI DEPAN</text>
  </g>

  <!-- CATATAN BOM & HARDWARE -->
  <g transform="translate(218, 95)">
    <text x="0" y="-2" class="text-label">BOM Perakitan Case PCB:</text>
    <rect x="0" y="0" width="98" height="97" fill="#fafafa" stroke="#dddddd" stroke-width="0.3" rx="2" />
    <text x="4" y="8" class="dim-label" font-weight="bold">Data Fisik PCB (EasyEDA):</text>
    <text x="4" y="15" class="dim-label">• Ukuran: 70.0 x 40.0 mm</text>
    <text x="4" y="22" class="dim-label">• Jarak Baut: 64.4 x 34.4 mm</text>
    <text x="4" y="29" class="dim-label">• Space Kiri-Kanan: 1.0 cm (10 mm)</text>
    <text x="4" y="36" class="dim-label">• Panel Kiri: Port USB Type-C</text>
    <text x="4" y="43" class="dim-label">• Panel Kanan: Screw Terminal &amp; Fan</text>
    <text x="4" y="50" class="dim-label">• Panel Belakang: Kabel ke Tunnel</text>
    <text x="4" y="57" class="dim-label">• Pelat Atas: Dudukan DHT22 &amp; LED</text>
    <text x="4" y="66" class="dim-label" font-weight="bold">Hardware Diperlukan:</text>
    <text x="4" y="73" class="dim-label">1. Standoff Sudut M3 x 40 mm (4 pcs)</text>
    <text x="4" y="80" class="dim-label">2. Spacer Dudukan PCB M3 x 6 mm (4 pcs)</text>
    <text x="4" y="87" class="dim-label">3. Baut M3 x 6 mm (12 pcs)</text>
    <text x="4" y="94" class="dim-label">4. Bahan Akrilik Bening 3.0 mm</text>
  </g>
</svg>