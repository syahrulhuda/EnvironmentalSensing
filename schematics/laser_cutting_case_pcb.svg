<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 195" width="220mm" height="195mm">
  <title>Desain 2D Akrilik 3mm - Case PCB Alat (2 Lubang Baut DHT22 &amp; Kisi Ventilasi Lengkap)</title>
  <style>
    .cut { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .hole { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .slot { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .engrave { fill: none; stroke: #0000ff; stroke-width: 0.15; stroke-dasharray: 1,1; }
    .label { font-family: Arial, sans-serif; font-size: 2.2px; font-weight: bold; fill: #222; }
    .sublabel { font-family: Arial, sans-serif; font-size: 1.8px; fill: #555; }
  </style>
  
  <text x="10" y="8" font-family="Arial, sans-serif" font-size="3.6px" font-weight="bold" fill="#111">POLA LASER CUTTING CASE PCB ALAT (2 BAUT DHT22 ATAS-BAWAH &amp; DC JACK)</text>
  <text x="10" y="12" font-family="Arial, sans-serif" font-size="2.0px" fill="#666">*Catatan: DHT22 memiliki 2 baut (kuping atas &amp; PCB bawah pitch 35mm), dinding kiri tanpa lubang USB-C, dan dinding kanan soket DC-022.</text>
  
    <!-- ======================================================== -->
  <!-- 1. PELAT TUTUP ATAS CASE (96 x 50 mm - RATA DINDING SAMPING & STANDOFF INTERNAL) -->
  <!-- ======================================================== -->
  <g transform="translate(10, 18)">
    <text x="0" y="-3" class="label">1. Pelat Tutup Atas Case (96 x 50 mm - Rata Dinding Samping, Sudut Bulat R3.5, 4 Standoff Internal)</text>
    <rect x="0" y="0" width="96" height="50" rx="3.5" class="cut" />
    
    <!-- 4 Lubang Spacer Internal Case (M3 Dia 3.2mm - Selaras Vertikal 1:1 ke Tunnel) -->
    <circle cx="8.0" cy="9.5" r="1.6" stroke="#00aa00" stroke-width="0.25" fill="none" />
    <circle cx="88.5" cy="9.5" r="1.6" stroke="#00aa00" stroke-width="0.25" fill="none" />
    <circle cx="8.0" cy="40.5" r="1.6" stroke="#00aa00" stroke-width="0.25" fill="none" />
    <circle cx="88.5" cy="40.5" r="1.6" stroke="#00aa00" stroke-width="0.25" fill="none" />
    <text x="3.0" y="8.0" font-family="Arial, sans-serif" font-size="1.4px" fill="#008800">SPACER</text>
    <text x="84.0" y="8.0" font-family="Arial, sans-serif" font-size="1.4px" fill="#008800">SPACER</text>
    
    <!-- Slot/Purus Pengunci 4 Dinding Case (Tebal 3.1mm) -->
    <!-- Dinding Depan & Belakang -->
    <rect x="38.0" y="1.9" width="20.0" height="3.1" class="slot" />
    <rect x="38.0" y="45.0" width="20.0" height="3.1" class="slot" />
    <!-- Dinding Samping Kiri & Kanan (Notch Flush Sisi) -->
    <rect x="0.0" y="15.0" width="3.1" height="20.0" class="slot" />
    <rect x="92.9" y="15.0" width="3.1" height="20.0" class="slot" />
    
    <!-- Jendela Display OLED 0.96 Inci (Center X=26.5 mm, Y=25.0 mm) -->
    <rect x="14.5" y="18.5" width="24.0" height="13.0" rx="1.5" class="slot" />
    <!-- 4 Lubang Baut OLED 0.96 (M2 Dia 2.5 mm - Pitch 23.3 x 23.3 mm) -->
    <circle cx="14.85" cy="13.35" r="1.25" class="hole" />
    <circle cx="38.15" cy="13.35" r="1.25" class="hole" />
    <circle cx="14.85" cy="36.65" r="1.25" class="hole" />
    <circle cx="38.15" cy="36.65" r="1.25" class="hole" />
    <text x="18.5" y="25.5" font-family="Arial, sans-serif" font-size="1.8px" fill="#0066cc">OLED 0.96"</text>
    
    <!-- Lubang Indikator LED RGB 5mm (D1) di Center X=53.64, Y=14.39 mm (Dia 5.5 mm) -->
    <circle cx="53.64" cy="14.39" r="2.75" class="hole" />
    <text x="47.0" y="11.5" font-family="Arial, sans-serif" font-size="1.8px" fill="#cc0066">LED RGB</text>
    
    <!-- Kisi-Kisi Ventilasi Pasif Atas (4 Lubang Oval 12 x 2.0 mm) -->
    <rect x="44.0" y="22.0" width="12.0" height="2.0" rx="1.0" class="slot" />
    <rect x="44.0" y="26.0" width="12.0" height="2.0" rx="1.0" class="slot" />
    <rect x="44.0" y="30.0" width="12.0" height="2.0" rx="1.0" class="slot" />
    <rect x="44.0" y="34.0" width="12.0" height="2.0" rx="1.0" class="slot" />
    
    <!-- JENDELA SENSOR SUHU & KELEMBABAN DHT22 (AM2302) -->
    <rect x="67.0" y="12.25" width="15.5" height="25.5" rx="1.2" class="slot" />
    <!-- 2 Lubang Baut M3 Mounting DHT22 (Pitch 35 mm) -->
    <circle cx="74.75" cy="7.50" r="1.6" class="hole" />
    <circle cx="74.75" cy="42.50" r="1.6" class="hole" />
    <text x="67.5" y="25.5" font-family="Arial, sans-serif" font-size="1.8px" fill="#0066cc">DHT22 BODI PUTIH</text>
  </g>

  <!-- ======================================================== -->
  <!-- 2. DINDING SISI KIRI (KISI VENTILASI - TANPA USB-C) (40 x 46 mm) -->
  <!-- ======================================================== -->
  <g transform="translate(10, 80)">
    <text x="0" y="-3" class="label">2. Dinding Sisi Kiri (40 x 46 mm - Kisi Ventilasi)</text>
    <path d="M 0,3 L 10,3 L 10,0 L 30,0 L 30,3 L 40,3 L 40,43 L 30,43 L 30,46 L 10,46 L 10,43 L 0,43 Z" class="cut" />
    <!-- 3 Baris Kisi Ventilasi Samping (Tanpa Lubang USB-C) -->
    <rect x="11.0" y="16.0" width="18.0" height="2.2" rx="1.0" class="slot" />
    <rect x="11.0" y="23.0" width="18.0" height="2.2" rx="1.0" class="slot" />
    <rect x="11.0" y="30.0" width="18.0" height="2.2" rx="1.0" class="slot" />
    <text x="11.5" y="37.0" class="sublabel">VENTILASI</text>
  </g>

  <!-- ======================================================== -->
  <!-- 3. DINDING SISI KANAN (POWER DC BARREL JACK DC-022) (40 x 46 mm) -->
  <!-- ======================================================== -->
  <g transform="translate(60, 80)">
    <text x="0" y="-3" class="label">3. Dinding Sisi Kanan (40 x 46 mm - DC Jack)</text>
    <path d="M 0,3 L 10,3 L 10,0 L 30,0 L 30,3 L 40,3 L 40,43 L 30,43 L 30,46 L 10,46 L 10,43 L 0,43 Z" class="cut" />
    <!-- Lubang Ulir M12 DC Barrel Jack DC-022 (Dia 12.0 mm) -->
    <circle cx="20.0" cy="23.0" r="6.0" class="hole" />
    <text x="10.5" y="23.5" font-family="Arial, sans-serif" font-size="1.7px" fill="#0066cc" font-weight="bold">DC-022 (12mm)</text>
    <!-- 2 Kisi Ventilasi Samping -->
    <rect x="11.0" y="10.0" width="18.0" height="2.0" rx="1.0" class="slot" />
    <rect x="11.0" y="36.0" width="18.0" height="2.0" rx="1.0" class="slot" />
  </g>

  <!-- ======================================================== -->
  <!-- 4. DINDING SISI DEPAN (96 x 46 mm) -->
  <!-- ======================================================== -->
  <g transform="translate(110, 80)">
    <text x="0" y="-3" class="label">4. Dinding Sisi Depan (96 x 46 mm)</text>
    <path d="M 0,3 L 38,3 L 38,0 L 58,0 L 58,3 L 96,3 L 96,43 L 58,43 L 58,46 L 38,46 L 38,43 L 0,43 Z" class="cut" />
    <!-- 3 Baris Kisi Estetis Depan -->
    <rect x="20.0" y="16.0" width="56.0" height="2.5" rx="1.2" class="slot" />
    <rect x="25.0" y="21.0" width="46.0" height="2.5" rx="1.2" class="slot" />
    <rect x="30.0" y="26.0" width="36.0" height="2.5" rx="1.2" class="slot" />
  </g>

  <!-- ======================================================== -->
  <!-- 5. DINDING SISI BELAKANG (VENTILASI KISI PENUH) (96 x 46 mm) -->
  <!-- ======================================================== -->
  <g transform="translate(110, 138)">
    <text x="0" y="-3" class="label">5. Dinding Sisi Belakang (96 x 46 mm - Kisi Penuh)</text>
    <path d="M 0,3 L 38,3 L 38,0 L 58,0 L 58,3 L 96,3 L 96,43 L 58,43 L 58,46 L 38,46 L 38,43 L 0,43 Z" class="cut" />
    <!-- 3 Baris Kisi Estetis Belakang -->
    <rect x="20.0" y="16.0" width="56.0" height="2.5" rx="1.2" class="slot" />
    <rect x="25.0" y="21.0" width="46.0" height="2.5" rx="1.2" class="slot" />
    <rect x="30.0" y="26.0" width="36.0" height="2.5" rx="1.2" class="slot" />
  </g>
</svg>
