name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: hosting-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Web Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Menggunakan autentikasi Google Service Account..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            npx --yes firebase-tools deploy --only hosting --project environmental-sensing-f6e1c --non-interactive
            rm -f "$RUNNER_TEMP/sa.json"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Menggunakan autentikasi Firebase CI Token..."
            npx --yes firebase-tools deploy --only hosting --project environmental-sensing-f6e1c --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Kredensial Firebase belum disetel di GitHub Secrets! Pastikan FIREBASE_SERVICE_ACCOUNT sudah diatur."
            exit 1
          fi
